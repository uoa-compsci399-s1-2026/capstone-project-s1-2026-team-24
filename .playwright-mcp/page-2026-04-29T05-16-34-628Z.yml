    - generic [ref=e50]:
      - generic [ref=e51]:
        - heading "Who are we" [level=2] [ref=e52]
        - generic [ref=e53]:
          - paragraph [ref=e54]: HNU is a University of Auckland research facility, established in 1998 as a collaboration between the School of Biological Sciences and the Department of Medicine at the University of Auckland.
          - paragraph [ref=e55]: It is New Zealand's only live-in nutrition trials facility which has the capability to carry out long-term human residential studies.
      - img "HNU building" [ref=e57]
    - heading "What we do" [level=2] [ref=e59]
    - generic [ref=e62]:
      - img "Services and expertise" [ref=e64]
      - generic [ref=e65]:
        - heading "Services & Expertise" [level=3] [ref=e66]
        - paragraph [ref=e67]: The Human Nutrition Unit provides a comprehensive range of services across both academic and commercially funded research. These include consultancy on nutrition regulatory issues and health claims, trial design and protocol development, participant recruitment and screening, and full trial management and coordination. The team also delivers data collection, analysis, interpretation, and the publication of peer-reviewed scientific research.
    - generic [ref=e70]:
      - generic [ref=e71]:
        - heading "Capabilities" [level=3] [ref=e72]
        - paragraph [ref=e73]: The Unit is equipped to deliver highly controlled and precise nutrition research. Capabilities include controlled diet provision, energy expenditure measurement, anthropometric assessments such as body composition analysis, and clinical procedures including phlebotomy and venous cannulation. Additional services include urine and faecal sample collection, with external nursing support available for overnight studies when required.
        - link "Read More →" [ref=e74] [cursor=pointer]:
          - /url: /research
      - img "Research capabilities" [ref=e76]
    - generic [ref=e79]:
      - img "HNU facilities" [ref=e81]
      - generic [ref=e82]:
        - heading "Facilities" [level=3] [ref=e83]
        - paragraph [ref=e84]: HNU offers a purpose-built research environment designed to support controlled human nutrition studies. Facilities include a clinical room for blood collection, an indirect calorimetry room for measuring energy expenditure, an interview lounge, and a biological sample handling laboratory. The Unit also features a metabolic kitchen and five fully furnished residential bedrooms, along with bathroom facilities, enabling both short- and long-term live-in studies.
