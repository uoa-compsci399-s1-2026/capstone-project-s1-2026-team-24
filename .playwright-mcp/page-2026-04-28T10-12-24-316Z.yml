          - list [ref=e51]:
            - listitem [ref=e52]: Obesity and body-weight control
            - listitem [ref=e53]: Regulation of appetite
            - listitem [ref=e54]: Obesity related metabolic disorders
            - listitem [ref=e55]: Cardiovascular risk, including dyslipidaemias
            - listitem [ref=e56]: Pre-diabetes and Type 2 diabetes
            - listitem [ref=e57]: Metabolism & nutrition
