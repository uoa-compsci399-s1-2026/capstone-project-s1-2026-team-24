            - listitem [ref=e64]: Dietary proteins, including dairy proteins
            - listitem [ref=e65]: Dietary carbohydrates, including soluble (ß-glucan) and insoluble dietary fibres
            - listitem [ref=e66]: Plant Flavonoids
      - paragraph [ref=e67]: We conduct investigations into healthy men and women participants and participants with different states of metabolic health.
    - generic [ref=e69]:
      - heading "Trial Design" [level=2] [ref=e70]
      - generic [ref=e71]:
        - paragraph [ref=e72]: The Human Nutrition Unit carries out intervention trials investigating the relationships between diet and markers of health and disease.
        - paragraph [ref=e73]: Trials are randomised, placebo-controlled, single or double blind interventions and may be of either a cross-over or parallel design.
        - paragraph [ref=e74]: All trials are required to conform to human ethics procedures and good clinical practice (GCP), and human ethics committee approval is mandatory. Therapeutic trials are also required to obtain NZ Standing Committee on Therapeutic Trials (SCOTT) and MedSafe approval.
      - generic [ref=e75]:
        - heading "Residential Trials" [level=3] [ref=e76]
        - generic [ref=e77]:
          - paragraph [ref=e78]:
            - strong [ref=e79]: Day stay (single day) studies
            - text: carried out within the Human Nutrition Unit research clinic – these studies require volunteer participants to spend the day at the Unit where a range of tests are carried. Most studies are complete by 5pm when volunteers return home.
          - paragraph [ref=e80]:
            - strong [ref=e81]: Longer term (1-4 weeks) residential studies
            - text: carried out within the Human Nutrition Unit residential facility – these studies require volunteer participants to live at the Unit and follow a carefully controlled dietary regime. Breakfast, dinner and overnight stay occur within the comfortable facilities of the Unit. During the day participants may attend work or study taking with them their food requirements for the day. Careful control and provision of all dietary components increases both the accuracy of the trial, since precise dietary components can be altered, and the compliance of the participants.
          - paragraph [ref=e82]: Many of these studies are of a 'cross-over' design, where the participant completes both the treatment and control arms of the trial. This gives additional power to the study to detect significant effects of the dietary component under investigation using only a small number of trial subjects.
          - paragraph [ref=e83]: Entry into the trial is randomised and treatment group blinded until completion.
      - generic [ref=e84]:
        - heading "Community Trials" [level=3] [ref=e85]
        - generic [ref=e86]:
          - paragraph [ref=e87]:
            - strong [ref=e88]: Long term (3-6 months) community studies
            - text: which require visits to the Human Nutrition Unit research clinic for blood tests and other measurements – study participants continue their usual home life attending clinical visits to collect dietary test components and for study measurements. Long term studies allow the testing of products such as putative weight loss agents to be trialed.
          - paragraph [ref=e89]: Many of these studies are of a 'parallel' design, where participants are randomised into either the treatment or the control arm of the trial.
    - generic [ref=e91]:
