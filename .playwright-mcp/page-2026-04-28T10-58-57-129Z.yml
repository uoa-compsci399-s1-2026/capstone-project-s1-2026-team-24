      - generic [ref=e45]:
        - heading "Our Collaborations" [level=2] [ref=e46]
        - paragraph [ref=e47]: The Human Nutrition Unit encourages research collaborations with industry and academic units, both nationally and internationally.
        - paragraph [ref=e48]: "The research pathway includes:"
        - list [ref=e49]:
          - listitem [ref=e50]: early inception hypotheses
          - listitem [ref=e51]: protocol development
          - listitem [ref=e52]: ethical and regulatory approval
          - listitem [ref=e53]: completion of trials
          - listitem [ref=e54]: data analysis
          - listitem [ref=e55]: interpretation
          - listitem [ref=e56]: report writing and publication
        - paragraph [ref=e57]: The Unit ensures compliance with Good Clinical Practice, up to the level of ICH GCP where required, and has experience of and welcomes independent trial monitoring and audit processes.
      - generic [ref=e59]:
        - heading "Academic Collaborations" [level=2] [ref=e60]
        - paragraph [ref=e61]: Academic collaborations aim to contribute to nutrition research within an academic environment.
        - paragraph [ref=e62]: As well as collaborations with Schools and Faculties within the University of Auckland, the Unit also collaborates with the Wellington Medical School, University of Otago, NZ and internationally with academic departments in Australia, Japan and Hong Kong.
        - paragraph [ref=e63]: Examples of Collaborations
        - list [ref=e64]:
          - listitem [ref=e65]: dairy bioactives and health, LactoPharma consortium
          - listitem [ref=e66]: marine polysaccharide Chitosan and weight loss, collaboration with the University of Queensland, Aus
          - listitem [ref=e67]: Omega-3 polyunsaturated fatty acids (fish oils) and stroke, collaboration with the George Institute, Aus
          - listitem [ref=e68]: Adipokynes in obesity, collaboration with the University of Hong Kong
      - generic [ref=e70]:
